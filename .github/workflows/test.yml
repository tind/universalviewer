name: Test

on:
  push:
    tags-ignore:
      - "v*"

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Checkout
        uses: actions/checkout@v6

      - name: Install npm dependencies
        run: npm clean-install

      - name: Lint code
        run: npm run lint-code && git diff --exit-code

      - name: Lint styles
        run: npm run lint-styles && git diff --exit-code

      - name: Prettify code
        run: npm run prettify && git diff --exit-code

      - name: Build assets
        run: npm run build && npm run build-tsc && npm run build-es

      - name: Run tests
        run: npm run test
